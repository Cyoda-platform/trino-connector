# suppress inspection "UnusedProperty" for whole file
connector.name=cyoda
cyoda.presto.schema-name=reporting

cyoda.presto.server.url=http://localhost:8082/
cyoda.presto.request-page-size=100
cyoda.presto.refresh-token-endpoint=/api/auth/token

cyoda.presto.rsocket.bind-address=localhost
cyoda.presto.rsocket.port=7000

cyoda.presto.log-api-call-stats = true

